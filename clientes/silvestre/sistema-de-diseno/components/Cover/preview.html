<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Silvestre</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--fondo); color:var(--texto); font-family:var(--font-texto); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:496px; height:288px; }
  .naranja { fill:var(--naranja); }
  .tint { fill:var(--verde-claro); }
  .deep { fill:var(--verde-accion); }
  .verde { fill:var(--verde); }
  .hoja { fill:var(--verde); }
  .corte { fill:var(--naranja-claro); }
  .r-sm { rx:var(--radius-sm); }
  .r-md { rx:var(--radius-md); }
  .r-lg { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-8); right:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-titulos); font-size:80px; line-height:.92; font-weight:800; letter-spacing:-.01em; color:var(--texto); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--texto-secundario); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 496 288" width="496" height="288">
<!--
  blocks      naranja 160x232 bled off the top (the logo's word, the colour people know) · verde-accion 144x208 bled off the right edge (the deep ink of the buttons) · verde-claro 160x176 (the footer tint) · verde 64x24 once (the leaf green, small) — about 35% of 960x288
  arrangement one tall naranja slab with satellites, bottoms near one line, gutters space-6
  pattern     literal motif: the rama that closes the logo, built as a stem pill (radius-sm) with six leaf pills (radius-md, half of 16) over the tint, and three leaves cut into the slab in naranja-claro
  scales      sides in space-2 multiples; gutters space-6; leaf pitch space-6; corners radius-lg on slabs, radius-md leaves, radius-sm stem and small block
-->
<rect class="naranja r-lg" x="16" y="-16" width="160" height="232" rx="16"/>
<rect class="verde r-sm" x="16" y="240" width="64" height="24" rx="4"/>
<rect class="tint r-lg" x="200" y="88" width="128" height="176" rx="16"/>
<rect class="deep r-lg" x="352" y="56" width="144" height="208" rx="16"/>
<rect class="hoja r-sm" x="258" y="100" width="8" height="152" rx="4"/>
<rect class="hoja r-md" x="228" y="108" width="32" height="16" rx="8" transform="rotate(-32 260 116)"/>
<rect class="hoja r-md" x="264" y="132" width="32" height="16" rx="8" transform="rotate(32 264 140)"/>
<rect class="hoja r-md" x="228" y="156" width="32" height="16" rx="8" transform="rotate(-32 260 164)"/>
<rect class="hoja r-md" x="264" y="180" width="32" height="16" rx="8" transform="rotate(32 264 188)"/>
<rect class="hoja r-md" x="228" y="204" width="32" height="16" rx="8" transform="rotate(-32 260 212)"/>
<rect class="hoja r-md" x="264" y="228" width="32" height="16" rx="8" transform="rotate(32 264 236)"/>
<rect class="corte r-md" x="56" y="40" width="32" height="16" rx="8" transform="rotate(-32 72 48)"/>
<rect class="corte r-md" x="96" y="72" width="32" height="16" rx="8" transform="rotate(-32 112 80)"/>
<rect class="corte r-md" x="56" y="104" width="32" height="16" rx="8" transform="rotate(-32 72 112)"/>
</svg>
</div>
<div class="words">
<h1 class="name">Silvestre</h1>
<p class="tag">Máquinas y jardines · Maipú, Mendoza</p>
</div>
</div>
</body>
</html>
